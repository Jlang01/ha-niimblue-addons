configuration:
  transport:
    name: Transport
    description: >-
      serial = USB cable (recommended when the printer is plugged into the HA
      host). ble = Bluetooth LE through Home Assistant's own Bluetooth adapter
      (shared with HA's Bluetooth integration, no pairing needed).
  address:
    name: Printer address
    description: >-
      serial: device path, best a stable /dev/serial/by-id/... path. ble:
      printer MAC (e.g. C3:F9:26:03:17:20) or Bluetooth name (e.g.
      B21S-C2BF926031720). Leave empty to auto-detect (serial: NIIMBOT USB
      device; ble: scan by name). The add-on also starts when the printer is
      off and connects once it shows up.
  model:
    name: Printer model (printTask)
    description: >-
      Print task name (B1, D110, ...). B1 is the one that prints on the B21S
      (USB and Bluetooth). Empty = auto-detect on connect; for the B21S the
      add-on then uses B1 too, because niimbluelib's auto-detected D110
      prints blank labels on it.
  label_width:
    name: Label width (px)
    description: >-
      Fixed print image width. Leave width AND height at 0 for auto: fit
      prints to the label roll detected in the printer (RFID), or use the
      image as is when no roll is detected. B21 printhead max = 384.
  label_height:
    name: Label height (px)
    description: Fixed print image height. 0 (with width 0) = auto, see above.
  label_lookup:
    name: Look up label size online
    description: >-
      The roll's RFID tag holds a barcode but no size. When on, the size is
      fetched once per roll type from NIIMBOT's cloud (print.niimbot.com) and
      cached in the add-on. Only the roll's barcode is sent. Off = only
      sizes already cached are used.
  print_direction:
    name: Print direction
    description: top or left. B21 default is top.
  density:
    name: Print density
    description: Darkness 1-5 (B21 default 3).
  threshold:
    name: B/W threshold
    description: 1-255. Pixels above become black.
  image_fit:
    name: Image fit
    description: How the image is resized to the label (sharp fit modes).
  reconnect_seconds:
    name: Reconnect interval (s)
    description: >-
      Base retry interval while the printer is unreachable (backs off up to 5
      min) and MQTT status publish interval.
  idle_disconnect_seconds:
    name: Bluetooth idle disconnect (s)
    description: >-
      ble only. Release the Bluetooth link after this many idle seconds; the
      next print reconnects automatically (a few seconds). 0 = keep the
      printer connected permanently (holds an HA Bluetooth connection slot and
      keeps the printer awake).
  mqtt_enabled:
    name: Enable MQTT discovery
    description: >-
      Publish connected/status/battery/label/labels-remaining/reconnect
      entities to Home Assistant.
  log_level:
    name: Log level
    description: trace, debug, info, warning or error.
