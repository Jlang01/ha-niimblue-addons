worker_processes 1;
error_log /proc/self/fd/2 warn;
pid /run/nginx.pid;
events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /proc/self/fd/1;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 16m;   # label images

    server {
        listen 8099 default_server;
        root /opt/niimblue;
        index index.html;

        # --- REST print API, proxied to the add-on print server ---
        # Injected button posts to "api/print" (relative -> /api/print here).
        location /api/ {
            proxy_pass http://127.0.0.1:5000/;
            proxy_read_timeout 150s;   # BLE connect-on-demand + transfer can take a while
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # --- injected glue: never cache, so add-on updates always take effect ---
        location = /config.js     { add_header Cache-Control "no-store"; try_files $uri =404; }
        location = /host-print.js { add_header Cache-Control "no-store"; try_files $uri =404; }

        # --- designer SPA (relative-base build) ---
        location / {
            # Inject <base href> so relative assets + injected script resolve
            # correctly under the HA ingress sub-path.
            sub_filter '<head>' '<head><base href="$http_x_ingress_path/">';
            sub_filter '</body>' '<script src="config.js"></script><script src="host-print.js"></script></body>';
            sub_filter_once on;
            try_files $uri $uri/ /index.html;
        }
    }
}
