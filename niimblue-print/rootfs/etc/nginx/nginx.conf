worker_processes 1;
error_log /proc/self/fd/2 warn;
pid /run/nginx.pid;
events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;             # ingress UI polls status every few seconds
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 16m;   # label images / image templates

    server {
        listen 8099 default_server;
        # Ingress only: HA's Supervisor proxies the sidebar panel from
        # 172.30.32.2. Loopback stays allowed for in-container health checks.
        allow 172.30.32.2;
        allow 127.0.0.1;
        deny all;

        root /opt/niimblue;
        index index.html;

        # --- REST print API, proxied to the add-on print server ---
        # Requests from here are loopback for the server (no api_token) and
        # tagged as source "ui" for the print history.
        location /api/ {
            proxy_pass http://127.0.0.1:5000/;
            # prints answer after <= wait_timeout (30 s) with 200 or 202 (queued);
            # long multi-label jobs still need headroom
            proxy_read_timeout 600s;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Niimblue-Source ui;
        }

        # --- generated/injected glue + shell: never cache, so updates take effect ---
        location ~ ^/(config|host-print|app)\.js$ { add_header Cache-Control "no-store"; try_files $uri =404; }
        location = /app.css { add_header Cache-Control "no-store"; try_files $uri =404; }

        # --- NiimBlue designer (relative-base build), framed by the shell ---
        location /designer/ {
            # <base> so relative assets resolve under the ingress sub-path;
            # the glue scripts live one level up (shared with the shell).
            sub_filter '<head>' '<head><base href="$http_x_ingress_path/designer/">';
            # api/label.js = detected label roll (window.NIIMBLUE_LABEL), loaded
            # synchronously so host-print.js can preselect the label size
            # before the designer starts. If the server is down it just fails.
            sub_filter '</body>' '<script src="../config.js"></script><script src="../api/label.js"></script><script src="../host-print.js"></script></body>';
            sub_filter_once on;
            try_files $uri $uri/ /designer/index.html;
        }

        # --- sidebar shell: status bar + tabs (Designer / Quick print / ...) ---
        # (GET / -> index -> internal redirect to /index.html)
        location = /index.html {
            add_header Cache-Control "no-store";
            sub_filter '<head>' '<head><base href="$http_x_ingress_path/">';
            sub_filter_once on;
        }
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
