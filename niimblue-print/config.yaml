# Home Assistant add-on manifest
# Local add-on: NiimBlue Print Server
name: NiimBlue Print
version: "1.0.5"
slug: niimblue_print
description: >-
  NIIMBOT label designer (NiimBlue) + persistent host-side print server.
  Designs labels in the HA sidebar and prints over the host's USB-serial
  connection. Serial-only by default to avoid Bluetooth concurrency.
url: "https://github.com/MultiMote/niimblue-node"
arch:
  - aarch64
  - amd64
  - armv7
init: false

# --- Web UI embedded in HA sidebar (authenticated, no separate cert) ---
ingress: true
ingress_port: 8099
panel_icon: mdi:printer-pos
panel_title: NiimBlue

# --- Expose the raw print server so HA core rest_command can reach it ---
# Reachable from HA automations at http://<host>:5000 (or the addon hostname).
ports:
  5000/tcp: 5000
ports_description:
  5000/tcp: NiimBlue REST print API (for rest_command / automations)

# --- Hardware access ---
# uart -> maps /dev/ttyUSB* and /dev/ttyACM* (Niimbot USB-CDC serial).
uart: true
usb: true
udev: true
# If you later want BLE fallback, flip this true and set transport: ble.
host_dbus: false

# --- User options ---
options:
  transport: serial
  address: ""            # empty = auto-detect serial device (B21 = /dev/ttyACM0)
  model: "B1"            # printTask. B21/B21_C2B use the B1 task (384px head). Info
                         # auto-detect times out over serial on B21S, so hard-set it.
  label_width: 0         # px; 0 = use the designer image's own size. B21 printhead max = 384
  label_height: 0
  print_direction: top   # top | left
  density: 3
  threshold: 128
  image_fit: contain
  reconnect_seconds: 10
  mqtt_enabled: true
  log_level: info
schema:
  transport: list(serial|ble)
  address: device(subsystem=tty)?   # UI dropdown of tty serial devices; empty = auto-detect
  model: str?
  label_width: int(0,)
  label_height: int(0,)
  print_direction: list(top|left)
  density: int(1,5)
  threshold: int(1,255)
  image_fit: list(contain|cover|fill|inside|outside)
  reconnect_seconds: int(3,)
  mqtt_enabled: bool
  log_level: list(trace|debug|info|warning|error)

# Pull MQTT broker creds from the Mosquitto add-on automatically.
services:
  - mqtt:want
