# Home Assistant add-on manifest
name: NiimBlue Print
version: "1.3.0"
slug: niimblue_print
description: >-
  NIIMBOT label printing for Home Assistant: label designer, text labels,
  templates and a print queue in the sidebar, plus REST/MQTT for automations.
  Prints over USB or Bluetooth LE (through Home Assistant's own adapter).
url: "https://github.com/Jlang01/ha-niimblue-addons"
arch:
  - aarch64
  - amd64
init: false

# --- Web UI embedded in HA sidebar (authenticated, no separate cert) ---
ingress: true
ingress_port: 8099
panel_icon: mdi:printer-pos
panel_title: NiimBlue

# --- Print API for automations ---
# Not published on the host by default (null): HA core reaches it inside the
# Supervisor network as http://<add-on hostname>:5000 (see DOCS). Map a host
# port in the add-on's Network settings only if something outside HA needs
# it, and then set api_token.
ports:
  5000/tcp: null
ports_description:
  5000/tcp: NiimBlue REST print API (only for clients outside Home Assistant; set api_token)

# --- Home Assistant API: persistent notifications (labels / battery low) ---
homeassistant_api: true

# --- Hardware access ---
# uart -> cgroup access to ALL ttyACM*/ttyUSB* (by major number) + /dev
#         propagation, so a printer switched on AFTER the add-on started is
#         usable without a restart (hot-plug). That is also why `address` is a
#         plain string, not a `device` option: Supervisor refuses to START an
#         add-on whose `device` option points at a node that is absent
#         (printer off / unplugged at boot).
uart: true
usb: true
udev: true
# Bluetooth LE talks to the host's BlueZ over D-Bus (no raw HCI, no
# NET_ADMIN), so it shares the adapter with HA's Bluetooth integration.
host_dbus: true

# --- User options ---
options:
  transport: auto        # auto = USB NIIMBOT if plugged in, else Bluetooth LE
  address: ""            # "" = auto; /dev/serial/by-id/... (USB) or BLE MAC / name
  model: ""              # printTask; "" = auto (B21S -> B1, D110 prints blank there)
  label_width: 0         # px; 0/0 = auto: detected label roll (RFID), else the image's own size
  label_height: 0
  label_lookup: true     # look up the roll size by its RFID barcode at NIIMBOT's cloud (sends only the barcode)
  print_direction: top   # top | left
  density: 0             # 1-5; 0 = the printer model's default (B21S: 3)
  threshold: 128
  image_fit: contain
  disconnect_after_print: true  # Bluetooth: release the printer as soon as the queue is empty
  idle_disconnect_seconds: 60   # Bluetooth: release a link opened otherwise after N idle s; 0 = stay connected
  reconnect_seconds: 10
  wait_timeout: 30       # s a print request waits for the label before answering 202 (queued)
  queue_max_age_hours: 24  # queued jobs older than this are dropped (notification); 0 = keep forever
  low_label_threshold: 20  # notify when fewer labels are left on the roll; 0 = off
  notifications: true    # HA persistent notifications (labels / battery low, expired jobs)
  date_format: "YYYY-MM-DD"
  time_format: "HH:mm"
  timezone: ""           # "" = Home Assistant's time zone
  history_size: 20
  api_token: ""          # required (Bearer) from clients other than the sidebar when set
  mqtt_enabled: true
  log_level: info
schema:
  transport: list(auto|serial|ble)
  address: str?          # NOT device(): that blocks add-on start when the printer is off
  model: str?
  label_width: int(0,4096)
  label_height: int(0,4096)
  label_lookup: bool
  print_direction: list(top|left)
  density: int(0,5)
  threshold: int(1,255)
  image_fit: list(contain|cover|fill|inside|outside)
  disconnect_after_print: bool
  idle_disconnect_seconds: int(0,)
  reconnect_seconds: int(3,)
  wait_timeout: int(0,300)
  queue_max_age_hours: int(0,)
  low_label_threshold: int(0,)
  notifications: bool
  date_format: str?
  time_format: str?
  timezone: str?
  history_size: int(1,200)
  api_token: password?
  mqtt_enabled: bool
  log_level: list(trace|debug|info|warning|error)

# Pull MQTT broker creds from the Mosquitto add-on automatically.
services:
  - mqtt:want
