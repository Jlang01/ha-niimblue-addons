# Example: print a label when a package arrives / a button is pressed.
- alias: "Print shipping label on demand"
  triggers:
    - trigger: state
      entity_id: input_button.print_label
  actions:
    - action: rest_command.niimblue_print_url
      data:
        image_url: "https://your-host/labels/next.png"
        copies: 1

# Example: warn when the label roll runs low (MQTT "Labels remaining" sensor,
# from the roll's RFID tag; updates after each print).
- alias: "NiimBlue labels running low"
  triggers:
    - trigger: numeric_state
      entity_id: sensor.niimblue_printer_labels_remaining   # adjust to your entity id
      below: 20
  actions:
    - action: persistent_notification.create
      data:
        title: "Label printer"
        message: >-
          Only {{ states('sensor.niimblue_printer_labels_remaining') }} labels
          left on the {{ states('sensor.niimblue_printer_label') }} roll.

# Example: reconnect nudge (optional; the add-on already retries by itself)
- alias: "NiimBlue keep-alive reconnect"
  triggers:
    - trigger: time_pattern
      hours: "/6"
  conditions:
    - condition: state
      entity_id: binary_sensor.niimblue_printer_connected   # adjust to your entity id
      state: "off"
  actions:
    - action: rest_command.niimblue_reconnect
