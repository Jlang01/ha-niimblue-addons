# Add to configuration.yaml (or a !include). Lets HA automations print labels
# through the add-on's printer connection (USB serial or Bluetooth LE).
#
# HOST: the add-on exposes port 5000. Reach it either by:
#   - the HA host IP:            http://192.168.x.x:5000
#   - the local add-on hostname: http://local-niimblue_print:5000
# Pick whichever resolves in your setup; IP is the safe default.
#
# timeout: rest_command defaults to 10 s. A Bluetooth print that first has to
# connect, or a multi-copy job, takes longer -> keep 120.
#
# Size: no labelWidth/labelHeight here on purpose -> the add-on fits the image
# to the label roll it detected in the printer (or the label_width/height
# options, if set). Add "labelWidth": 384, "labelHeight": 240 to force a size.
# imageFit may be left out too: it then follows the image_fit option.

rest_command:
  # Print an image already reachable by URL (e.g. a generated label PNG).
  # printTask omitted on purpose -> the add-on's `model` option (or auto-detect;
  # B21S -> B1).
  niimblue_print_url:
    url: "http://192.168.x.x:5000/print"
    method: POST
    timeout: 120
    content_type: "application/json"
    payload: >-
      {
        "imageUrl": "{{ image_url }}",
        "printDirection": "top",
        "imageFit": "contain",
        "quantity": {{ copies | default(1) }}
      }

  # Print a base64 PNG (e.g. built by a template / python_script / pyscript).
  niimblue_print_base64:
    url: "http://192.168.x.x:5000/print"
    method: POST
    timeout: 120
    content_type: "application/json"
    payload: >-
      {
        "imageBase64": "{{ image_b64 }}",
        "printDirection": "top",
        "quantity": {{ copies | default(1) }}
      }

  # Force a reconnect (the add-on options decide transport + address).
  # The MQTT "Reconnect" button does the same.
  niimblue_reconnect:
    url: "http://192.168.x.x:5000/reconnect"
    method: POST
    timeout: 60
    content_type: "application/json"
    payload: "{}"
