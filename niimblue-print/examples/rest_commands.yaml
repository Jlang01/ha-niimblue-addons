# Add to configuration.yaml (or a !include). Lets HA automations print labels
# through the add-on's print queue (USB or Bluetooth LE).
#
# HOST: inside Home Assistant the add-on is reachable by its hostname = the
# add-on slug with "-" instead of "_". Open the add-on in Settings -> Add-ons:
# the page URL ends in e.g. ".../a0d7b954_niimblue_print" -> hostname
# "a0d7b954-niimblue-print" (a locally copied add-on: "local-niimblue-print").
# Port 5000 is NOT published on the host by default and not needed for this.
#
# api_token: if you set it in the add-on options, keep the headers: block
# (store the token in secrets.yaml as niimblue_token: "Bearer <token>").
# Without a token, delete the headers: blocks.
#
# Answers: 200 = printed; 202 = queued (printer off / out of range), it prints
# by itself once the printer is reachable; 4xx/5xx = error. The add-on answers
# after wait_timeout (30 s) at the latest -> timeout 60 is plenty.

rest_command:
  # Text label, laid out and sized to the detected roll by the add-on.
  # Call with data: {lines: ["Mehl", "Type 405"], wrap: false, copies: 1}
  niimblue_print_text:
    url: "http://a0d7b954-niimblue-print:5000/print/text"
    method: POST
    timeout: 60
    headers:
      Authorization: !secret niimblue_token
    content_type: "application/json"
    payload: >-
      {
        "lines": {{ lines | default([]) | tojson }},
        "wrap": {{ wrap | default(false) | tojson }},
        "bold": {{ bold | default(false) | tojson }},
        "qr": {{ qr | default('') | tojson }},
        "quantity": {{ copies | default(1) | int }}
      }

  # Saved template with variables, e.g. data: {template: "Vorrat", vars: {name: "Zucker"}}
  niimblue_print_template:
    url: "http://a0d7b954-niimblue-print:5000/print/template/{{ template | urlencode }}"
    method: POST
    timeout: 60
    headers:
      Authorization: !secret niimblue_token
    content_type: "application/json"
    payload: >-
      {"vars": {{ vars | default({}) | tojson }}, "quantity": {{ copies | default(1) | int }}}

  # An image reachable by URL (http/https). printTask/size omitted on purpose:
  # the add-on picks them (B21S -> B1, fitted to the detected roll).
  niimblue_print_url:
    url: "http://a0d7b954-niimblue-print:5000/print"
    method: POST
    timeout: 60
    headers:
      Authorization: !secret niimblue_token
    content_type: "application/json"
    payload: >-
      {"imageUrl": {{ image_url | tojson }}, "quantity": {{ copies | default(1) | int }}}

  # A base64 PNG (e.g. built by a python_script / pyscript).
  niimblue_print_base64:
    url: "http://a0d7b954-niimblue-print:5000/print"
    method: POST
    timeout: 60
    headers:
      Authorization: !secret niimblue_token
    content_type: "application/json"
    payload: >-
      {"imageBase64": {{ image_b64 | tojson }}, "quantity": {{ copies | default(1) | int }}}

  # Force a reconnect. The MQTT "Reconnect" button does the same.
  niimblue_reconnect:
    url: "http://a0d7b954-niimblue-print:5000/reconnect"
    method: POST
    timeout: 60
    headers:
      Authorization: !secret niimblue_token
    content_type: "application/json"
    payload: "{}"
