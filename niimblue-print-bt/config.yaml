# Home Assistant add-on manifest — Bluetooth (Classic RFCOMM) variant.
# Prints over the HOST's internal Bluetooth adapter using a Bluetooth Classic
# RFCOMM (SPP) socket — kernel/BlueZ-arbitrated, so it COEXISTS with Home
# Assistant's Bluetooth integration on the same adapter. No dedicated USB
# Bluetooth dongle, no exclusive HCI grab, no USB passthrough.
#
# NOTE: this is Bluetooth *Classic* (RFCOMM/SPP), NOT BLE — that is what the
# niimprint backend speaks. The printer must support Classic SPP and be paired.
name: NiimBlue Print (Bluetooth)
version: "0.2.0"
slug: niimblue_print_bt
description: >-
  NIIMBOT label designer (NiimBlue) + host-side Bluetooth print server. Prints
  over Home Assistant's internal Bluetooth adapter via a Classic RFCOMM socket
  (coexists with HA Bluetooth). No USB passthrough or Bluetooth dongle required.
url: "https://github.com/Jlang01/ha-niimblue-addons"
arch:
  - aarch64
  - amd64
  - armv7
init: false

# --- Web UI embedded in HA sidebar (authenticated, no separate cert) ---
ingress: true
ingress_port: 8099
panel_icon: mdi:printer-pos
panel_title: NiimBlue BT

# --- Expose the raw print server so HA core rest_command can reach it ---
ports:
  5001/tcp: 5001
ports_description:
  5001/tcp: NiimBlue Bluetooth REST print API (for rest_command / automations)

# --- Bluetooth access ----------------------------------------------------
# host_dbus : talk to BlueZ (bluetoothctl) for pairing/scanning.
# privileged: AF_BLUETOOTH RFCOMM sockets need CAP_NET_RAW; NET_ADMIN helps
#             manage the adapter.
host_dbus: true
privileged:
  - NET_ADMIN
  - NET_RAW

# --- User options ---
options:
  address: ""            # printer Bluetooth MAC (AA:BB:CC:DD:EE:FF). Leave EMPTY
                         # to scan+pair from the add-on's setup page (no SSH);
                         # the paired MAC is remembered. Set it here to pin one.
  model: "b21"           # b1 | b18 | b21 | d11 | d110 (B21S uses b21)
  density: 3
  rotate: 0              # 0 | 90 | 180 | 270 (clockwise, applied host-side)
  mqtt_enabled: true
  log_level: info
schema:
  address: str?
  model: list(b1|b18|b21|d11|d110)
  density: int(1,5)
  rotate: list(0|90|180|270)
  mqtt_enabled: bool
  log_level: list(trace|debug|info|warning|error)

# Pull MQTT broker creds from the Mosquitto add-on automatically.
services:
  - mqtt:want
